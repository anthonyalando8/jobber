<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · Prospector</title>
<style>
 :root{--bg:#f6f7f9;--card:#fff;--ink:#101828;--muted:#667085;--line:#d0d5dd;--accent:#2459d6;--accent-hover:#1c49b8;--error:#b42318;--error-soft:#fef3f2}
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
 main{width:100%;max-width:380px;background:var(--card);border:1px solid #e4e7ec;border-radius:12px;padding:32px 28px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
 .brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;margin-bottom:24px}
 .mark{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;font-weight:700}
 h1{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
 p{margin:0 0 22px;color:var(--muted)}
 label{display:block;font-weight:500;margin-bottom:6px;font-size:13px}
 input{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}
 input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #eef3fd}
 button{margin-top:16px;width:100%;height:40px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
 button:hover{background:var(--accent-hover)}
 .error{margin:0 0 16px;padding:10px 12px;border:1px solid #fecdca;background:var(--error-soft);border-radius:8px;color:var(--error)}
</style>
</head>
<body>
<main>
 <div class="brand"><span class="mark" aria-hidden="true">P</span>Prospector</div>
 <h1>Sign in</h1>
 <p>Enter the admin access key to continue.</p>
 {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
 <form method="post" action="/login" autocomplete="off">
  <input type="hidden" name="next" value="{{.Next}}">
  <label for="key">Access key</label>
  <input id="key" name="key" type="password" required autofocus autocomplete="current-password">
  <button type="submit">Sign in</button>
 </form>
</main>
</body>
</html>
