<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · Prospector</title>
<style>
 :root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--muted:#6b6a66;--line:#dedcd6;--accent:#2f5d50;--error:#a33a2b}
 @media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1e;--ink:#ecebe7;--muted:#a3a29d;--line:#34332f;--accent:#7fb3a3;--error:#e08a7c}}
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
 main{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
 h1{margin:0 0 4px;font-size:20px}
 p{margin:0 0 20px;color:var(--muted)}
 label{display:block;font-weight:600;margin-bottom:6px}
 input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
 input:focus{outline:2px solid var(--accent);outline-offset:1px}
 button{margin-top:16px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--card);font:inherit;font-weight:600;cursor:pointer}
 .error{margin:0 0 16px;color:var(--error)}
</style>
</head>
<body>
<main>
 <h1>Prospector</h1>
 <p>Enter the admin access key to continue.</p>
 {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
 <form method="post" action="/login" autocomplete="off">
  <input type="hidden" name="next" value="{{.Next}}">
  <label for="key">Access key</label>
  <input id="key" name="key" type="password" required autofocus autocomplete="current-password">
  <button type="submit">Sign in</button>
 </form>
</main>
</body>
</html>
